<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insight Hub</title>
  <link rel="stylesheet" href="insight.css">
</head>
<body>

  <!-- Navbar -->
  <header>
    <div class="nav-left"><h1>Insight Hub</h1></div>
    <div class="nav-center"><input type="text" placeholder="Search..."></div>
    <div class="nav-right">
      <button class="btn btn-white" onclick="openModal('loginModal')">Login</button>
      <button class="btn btn-blue" onclick="openModal('signupModal')">Sign Up</button>
    </div>
  </header>

  <!-- Layout -->
  <div class="layout">
    <!-- Left Sidebar -->
    <aside class="sidebar-left">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Questions</a></li>
        <li><a href="#">Topics</a></li>
        <li><a href="#">Spaces</a></li>
        <li><a href="#">Notifications</a></li>
      </ul>
    </aside>

    <!-- Main Feed -->
    <main>
      <div class="insights-feed" id="feed"></div>
    </main>

    <!-- Right Sidebar -->
    <aside class="sidebar-right">
      <div class="card">
        <h3>Trending</h3>
        <ul>
          <li>Faith & Growth</li>
          <li>Prayer Life</li>
          <li>Community</li>
        </ul>
      </div>
    </aside>
  </div>

  <!-- Floating Button -->
  <button id="fab" onclick="openModal('postModal')">+</button>

  <!-- Modals -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('loginModal')">&times;</span>
      <h2>Login</h2>
      <input type="text" id="loginEmail" class="field" placeholder="Email">
      <input type="password" id="loginPassword" class="field" placeholder="Password">
      <button class="btn btn-blue" onclick="login()">Login</button>
    </div>
  </div>

  <div id="signupModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('signupModal')">&times;</span>
      <h2>Sign Up</h2>
      <input type="text" id="signupUsername" class="field" placeholder="Username">
      <input type="text" id="signupEmail" class="field" placeholder="Email">
      <input type="password" id="signupPassword" class="field" placeholder="Password">
      <button class="btn btn-blue" onclick="signup()">Sign Up</button>
    </div>
  </div>

  <div id="postModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('postModal')">&times;</span>
      <h2>New Insight</h2>
      <input type="text" id="postTitle" class="field" placeholder="Title">
      <textarea id="postBody" class="field" rows="4" placeholder="Share your thoughts..."></textarea>
      <button class="btn btn-blue" onclick="createInsight()">Post</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="notification"></div>

  <script>
    const API = "https://insight-backend-gubm.onrender.com";
    const feed = document.getElementById("feed");
    const notif = document.getElementById("notification");

    function notify(msg){
      notif.innerText=msg;
      notif.style.display="flex";
      setTimeout(()=>notif.style.display="none",2500);
    }
    function openModal(id){document.getElementById(id).style.display="flex";}
    function closeModal(id){document.getElementById(id).style.display="none";}

    async function signup(){
      const username=document.getElementById("signupUsername").value;
      const email=document.getElementById("signupEmail").value;
      const password=document.getElementById("signupPassword").value;
      try{
        const res=await fetch(API+"/auth/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,email,password})});
        const data=await res.json();
        if(res.ok){notify("Signup successful");closeModal("signupModal");}
        else notify(data.error||"Signup failed");
      }catch(err){notify("Error");}
    }

    async function login(){
      const email=document.getElementById("loginEmail").value;
      const password=document.getElementById("loginPassword").value;
      try{
        const res=await fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
        const data=await res.json();
        if(res.ok){localStorage.setItem("token",data.token);notify("Login successful");closeModal("loginModal");loadInsights();}
        else notify(data.error||"Login failed");
      }catch(err){notify("Error");}
    }

    async function createInsight(){
      const token=localStorage.getItem("token");
      if(!token)return notify("Login required");
      const title=document.getElementById("postTitle").value;
      const body=document.getElementById("postBody").value;
      try{
        const res=await fetch(API+"/insights",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({title,body})});
        const data=await res.json();
        if(res.ok){notify("Insight posted");closeModal("postModal");loadInsights();}
        else notify(data.error||"Failed");
      }catch(err){notify("Error");}
    }

    async function loadInsights(){
      feed.innerHTML="Loading...";
      try{
        const res=await fetch(API+"/insights");
        const data=await res.json();
        feed.innerHTML="";
        data.forEach(ins=>{
          const div=document.createElement("div");
          div.className="card";
          div.innerHTML=`<h3>${ins.title}</h3>
            <div class="meta"><div class="avatar">${ins.username?ins.username[0].toUpperCase():"U"}</div><span>${ins.username||"Unknown"}</span></div>
            <p>${ins.body}</p>
            <div class="actions"><button class="chip">👍 Like</button><button class="chip">💬 Comment</button></div>`;
          feed.appendChild(div);
        });
      }catch(err){feed.innerHTML="Error loading feed";}
    }

    loadInsights();
  </script>

</body>
</html>
