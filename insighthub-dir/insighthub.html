<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insight Hub — Quora Style</title>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="insight.css" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="16x16" href="insighthub-favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="insighthub-favicon2-16x16.png" />
</head>
<body>
  <!-- Header -->
  <div id="header"></div>

  <!-- Main layout -->
  <div class="layout">
    <div class="center-feed">
      <div id="mainFeed"></div>
      <div id="qandaFeed"></div>
    </div>
    <div id="sidebarContainer"></div>
  </div>

  <!-- Modals -->
  <div id="modals"></div>

  <!-- Notifications -->
  <div id="notification"></div>

  <!-- Floating Action Button -->
  <button id="fab" class="fab">+</button>

  <!-- Theme Toggle -->
  <button id="themeToggle" class="btn btn-ghost"
    style="position: fixed; bottom: 1rem; left: 1rem; z-index: 4000;">🌓</button>

  <!-- Supabase ESM init -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    window.supabase = createClient(
      "https://xasbpjtbwttgguhidoek.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhhc2JwanRid3R0Z2d1aGlkb2VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1NzM4NTgsImV4cCI6MjA3NDE0OTg1OH0.rU1K36EV6ly3ikx_1BDUl5V0ok-FCzitDyDP0-0bJyk"
    );

    // Load partials into placeholders
    async function loadPartial(id, file) {
      const res = await fetch(`/partials/${file}`);
      const html = await res.text();
      document.getElementById(id).innerHTML = html;
    }

    loadPartial("header", "header.html");
    loadPartial("mainFeed", "feed.html");
    loadPartial("qandaFeed", "qanda.html");
    loadPartial("sidebarContainer", "sidebar.html");
    loadPartial("modals", "modals.html");
    loadPartial("notification", "notification.html");
  </script>

  <!-- Your app scripts -->
  <script type="module" src="../js/config.js"></script>
  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/auth.js"></script>
</body>
</html>
