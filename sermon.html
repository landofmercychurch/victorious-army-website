    "@type": "CollectionPage",

  <!-- =========================================== -->
  <!-- CRITICAL CSS -->
  <!-- =========================================== -->
  <style>
    :root {
      --primary-color: #4CAF50;
      --dark-bg: #000000;
      --text-primary: #FFFFFF;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--dark-bg);
      color: var(--text-primary);
    }

    .main-navigation {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }

    .nav-links {
      display: flex;
      gap: 1rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 500;
    }

    .nav-links a[aria-current="page"] {
      text-decoration: underline;
    }

    .page-header {
      position: fixed;
      top: 70px;
      width: 100%;
      text-align: center;
      padding: 1.5rem;
      z-index: 900;
      background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
    }

    main {
      padding-top: 140px;
      height: 100vh;
      overflow: hidden;
    }

    #sermonFeedContainer {
      height: calc(100vh - 140px);
    }

    .sermon-loading {
      text-align: center;
      margin-top: 40vh;
      font-size: 1rem;
      color: var(--text-primary);
    }
  </style>
</head>

<body>

  <!-- ========================================== -->
  <!-- NAVIGATION -->
  <!-- ========================================== -->
  <nav class="main-navigation">
    <div class="nav-container">
      <ul class="nav-links">
        <li><a href="index.html">🏠 Home</a></li>
        <li><a href="sermon.html" aria-current="page">🎬 Sermon Feed</a></li>
        <li><a href="index.html#contact">📞 Contact</a></li>
        <li><a href="index.html#live">🔴 Live</a></li>
      </ul>
      <div class="church-name">Victorious Army Revival Movement</div>
    </div>
  </nav>

  <!-- ========================================== -->
  <!-- PAGE HEADER -->
  <!-- ========================================== -->
  <header class="page-header">
    <h1>TikTok-Style Sermon Feed</h1>
    <p>Browse short sermon clips from Victorious Army Revival Movement.</p>
  </header>

  <!-- ========================================== -->
  <!-- MAIN CONTENT -->
  <!-- ========================================== -->
  <main>
    <div id="sermonFeedContainer" aria-live="polite">
      <div class="sermon-loading">
        <p>Loading inspiring sermons...</p>
      </div>
    </div>
  </main>

  <!-- ========================================== -->
  <!-- SCRIPT -->
  <!-- ========================================== -->
  <script type="module">
    import { initSermonTikTokFeed } from "./src/js/sermons.js";

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("sermonFeedContainer");
      const loader = document.querySelector(".sermon-loading");
      if (loader) loader.remove();
      if (container) initSermonTikTokFeed(container);
    });
  </script>

  <!-- ========================================== -->
  <!-- NOSCRIPT -->
  <!-- ========================================== -->
  <noscript>
    <p style="text-align:center; padding:2rem;">
      Please enable JavaScript to view the sermon feed.
    </p>
  </noscript>

</body>
</html>
