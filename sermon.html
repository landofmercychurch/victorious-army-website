<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sermon TikTok Feed - Victorious Army Revival Movement</title>
  <meta name="description" content="Browse and watch short sermon clips in TikTok-style feed. Scroll vertically to watch inspiring messages.">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="styles/sermon-tiktok.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.4/dist/hls.min.js"></script>
  
  <!-- TikTok-style feed specific styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      overflow: hidden;
    }
    
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.9);
      padding: 15px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-size: 14px;
      padding: 5px 10px;
      border-radius: 4px;
      transition: background 0.3s;
    }
    
    nav a:hover {
      background: rgba(255,255,255,0.1);
    }
    
    .sermon-header {
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      text-align: center;
      padding: 15px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
      z-index: 999;
    }
    
    .sermon-header h1 {
      margin: 0;
      font-size: 24px;
    }
    
    .sermon-header p {
      margin: 5px 0 0 0;
      color: #ccc;
      font-size: 14px;
    }
    
    main {
      position: relative;
      height: 100vh;
      overflow: hidden;
      padding-top: 120px; /* Account for header */
    }
    
    #sermonListContainer {
      height: calc(100vh - 120px);
      position: relative;
      background: #000;
    }
    
    /* Loading indicator */
    .loading-indicator {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
    }
    
    .spinner {
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top: 3px solid white;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Search overlay */
    .search-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 1001;
      display: none;
      padding: 80px 20px 20px;
    }
    
    .search-container {
      max-width: 600px;
      margin: 0 auto;
    }
    
    #sermonSearch {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border: 2px solid #4CAF50;
      border-radius: 8px;
      background: #111;
      color: white;
    }
    
    #closeSearch {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      padding: 10px;
    }
    
    .search-results {
      margin-top: 20px;
      max-height: 70vh;
      overflow-y: auto;
    }
    
    .search-result {
      display: flex;
      align-items: center;
      padding: 15px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .search-result:hover {
      background: rgba(255,255,255,0.2);
    }
    
    .search-result img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      margin-right: 15px;
    }
    
    .result-info h4 {
      margin: 0 0 5px 0;
      font-size: 16px;
    }
    
    .result-info p {
      margin: 0;
      font-size: 12px;
      color: #ccc;
    }
    
    .no-results {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    /* Control buttons */
    .search-btn, .refresh-btn, .filter-btn {
      position: fixed;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      z-index: 100;
      transition: all 0.3s;
    }
    
    .search-btn:hover, .refresh-btn:hover, .filter-btn:hover {
      background: rgba(0,0,0,0.9);
      border-color: white;
    }
    
    .search-btn {
      top: 20px;
      right: 20px;
    }
    
    .feed-controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
    }
    
    /* Scroll hint */
    .scroll-hint {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 12px;
      animation: bounce 2s infinite;
      z-index: 50;
    }
    
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateX(-50%) translateY(0);}
      40% {transform: translateX(-50%) translateY(-10px);}
      60% {transform: translateX(-50%) translateY(-5px);}
    }
    
    /* Mobile optimizations */
    @media (max-width: 768px) {
      nav {
        padding: 10px;
        font-size: 12px;
      }
      
      nav a {
        margin: 0 5px;
        padding: 5px 8px;
      }
      
      .sermon-header {
        padding: 10px;
      }
      
      .sermon-header h1 {
        font-size: 20px;
      }
      
      .sermon-header p {
        font-size: 12px;
      }
      
      .search-btn, .refresh-btn, .filter-btn {
        padding: 10px 15px;
        font-size: 12px;
      }
      
      .search-btn {
        right: 10px;
      }
      
      .feed-controls {
        right: 10px;
        bottom: 10px;
      }
    }
    
    /* Keyboard hint */
    .keyboard-hint {
      position: fixed;
      bottom: 50px;
      left: 20px;
      background: rgba(0,0,0,0.7);
      color: #ccc;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      z-index: 50;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav>
    <div>
      <a href="index.html">🏠 Home</a>
      <a href="sermon.html">🎬 Sermon Feed</a>
      <a href="index.html#contact">📞 Contact</a>
    </div>
    <div>
      <span style="color: #4CAF50; font-size: 12px;">Victorious Army Revival Movement</span>
    </div>
  </nav>
  
  <!-- Header -->
  <header class="sermon-header">
    <h1>🎬 TikTok-Style Sermon Feed</h1>
    <p>Scroll vertically ⬆️⬇️ to browse short sermon clips • Press spacebar for next</p>
  </header>
  
  <!-- Main TikTok Feed -->
  <main>
    <div id="sermonListContainer" class="sermon-list-container">
      <!-- TikTok-style vertical feed loads here -->
    </div>
    
    <!-- Scroll hint -->
    <div class="scroll-hint" id="scrollHint">
      ⬆️⬇️ Scroll or use arrow keys ⬆️⬇️
    </div>
    
    <!-- Keyboard hint -->
    <div class="keyboard-hint">
      ⌨️ Spacebar = Next • ↑↓ = Navigate
    </div>
  </main>

  <script type="module">
    import { initSermonTikTokFeed } from "./src/js/sermons.js";
    
    document.addEventListener('DOMContentLoaded', () => {
      // Hide scroll hint after 5 seconds
      setTimeout(() => {
        const hint = document.getElementById('scrollHint');
        if (hint) {
          hint.style.opacity = '0';
          hint.style.transition = 'opacity 1s';
          setTimeout(() => hint.style.display = 'none', 1000);
        }
      }, 5000);
      
      // Initialize TikTok feed
      initSermonTikTokFeed(document.getElementById('sermonListContainer'));
    });
  </script>
</body>
</html>
