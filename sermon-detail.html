<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Sermon...</title>
  <meta name="description" content="Watch this inspiring sermon from Victorious Army Revival Movement">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sermon-detail.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.4/dist/hls.min.js"></script>
</head>
<body>
  <nav>
    <a href="index.html">🏠 Home</a> | 
    <a href="src/js/sermons.html">📺 All Sermons</a>
  </nav>

  <main id="sermonDetailContainer" class="sermon-detail-container">
    <div class="loading">Loading sermon...</div>
  </main>

  <footer>
    <p>&copy; 2025 Victorious Army Revival Movement</p>
  </footer>

  <script type="module">
    import { initSermonDetail } from "./src/js/sermons.js";
    
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const sermonId = params.get('id');
      
      if (sermonId) {
        initSermonDetail(
          document.getElementById('sermonDetailContainer'),
          sermonId
        );
      } else {
        document.getElementById('sermonDetailContainer').innerHTML = `
          <div class="error">
            <h2>No Sermon Selected</h2>
            <p>Please select a sermon from the <a href="sermon.html">sermon library</a>.</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
