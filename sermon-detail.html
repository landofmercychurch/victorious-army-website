<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ... SEO meta tags ... -->
  <style>
    .sermon-detail-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .sermon-header {
      margin-bottom: 30px;
    }
    
    .sermon-thumbnail {
      width: 100%;
      height: 400px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 12px;
      margin-bottom: 20px;
      background-color: #f0f0f0; /* Placeholder color */
    }
    
    .sermon-meta {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      color: #666;
    }
    
    .sermon-description {
      line-height: 1.6;
      margin: 20px 0;
    }
    
    .sermon-actions
    padding: 20px 0;
    }
    
    .watch-youtube-btn {
      display: inline-block;
      background: #FF0000;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-right: 10px;
    }
    
    .back-to-feed {
      display: inline-block;
      background: #4CAF50;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="sermon-detail-container">
    <header class="sermon-header">
      <h1 id="sermonTitle">Loading...</h1>
      <div class="sermon-meta" id="sermonMeta"></div>
    </header>
    
    <div class="sermon-thumbnail" id="sermonThumbnail"></div>
    
    <div class="sermon-description" id="sermonDescription"></div>
    
    <div class="sermon-actions">
      <a href="#" id="youtubeLink" class="watch-youtube-btn" target="_blank" style="display: none;">
        📺 Watch Full on YouTube
      </a>
      <a href="sermon.html" class="back-to-feed">
        ← Back to Sermon Feed
      </a>
    </div>
  </div>

  <script type="module">
    import { api } from "./src/js/api.js";
    
    async function loadSermonDetail() {
      const params = new URLSearchParams(window.location.search);
      const sermonId = params.get('id');
      
      if (!sermonId) {
        window.location.href = 'sermon.html';
        return;
      }
      
      try {
        const sermon = await api.get(`/sermons/${sermonId}`);
        
        // Update page
        document.getElementById('sermonTitle').textContent = sermon.title;
        document.title = `${sermon.title} - Sermon Details`;
        
        // Meta info
        const meta = document.getElementById('sermonMeta');
        const duration = formatDuration(sermon.duration);
        meta.innerHTML = `
          <span>📅 ${new Date(sermon.created_at).toLocaleDateString()}</span>
          <span>⏱️ ${duration}</span>
          ${sermon.size_mb ? `<span>💾 ${sermon.size_mb.toFixed(1)} MB</span>` : ''}
        `;
        
        // Thumbnail or placeholder
        const thumbnail = document.getElementById('sermonThumbnail');
        if (sermon.thumbnail_url) {
          thumbnail.style.backgroundImage = `url('${sermon.thumbnail_url}')`;
        } else if (sermon.original_url) {
          thumbnail.style.backgroundImage = `url('${sermon.original_url}')`;
        } else {
          // Placeholder with sermon title
          thumbnail.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
          thumbnail.style.display = 'flex';
          thumbnail.style.alignItems = 'center';
          thumbnail.style.justifyContent = 'center';
          thumbnail.style.color = 'white';
          thumbnail.style.fontSize = '24px';
          thumbnail.style.fontWeight = 'bold';
          thumbnail.style.textAlign = 'center';
          thumbnail.style.padding = '20px';
          thumbnail.textContent = sermon.title.substring(0, 50) + (sermon.title.length > 50 ? '...' : '');
        }
        
        // Description
        const desc = document.getElementById('sermonDescription');
        desc.textContent = sermon.description || 'No description available.';
        
        // YouTube link
        const youtubeLink = document.getElementById('youtubeLink');
        if (sermon.youtube_url) {
          youtubeLink.href = sermon.youtube_url;
          youtubeLink.style.display = 'inline-block';
        }
        
      } catch (error) {
        console.error('Error loading sermon:', error);
        document.querySelector('.sermon-detail-container').innerHTML = `
          <div style="text-align: center; padding: 50px;">
            <h2>Sermon Not Found</h2>
            <p>The sermon you're looking for doesn't exist or has been removed.</p>
            <a href="sermon.html" class="back-to-feed">← Back to Sermon Feed</a>
          </div>
        `;
      }
    }
    
    function formatDuration(seconds) {
      if (!seconds) return 'N/A';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }
    
    // Load on page load
    document.addEventListener('DOMContentLoaded', loadSermonDetail);
  </script>
</body>
</html>
