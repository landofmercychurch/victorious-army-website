[build]
  publish = "."
  command = ""

# Client-side routing for SPA (Single Page App)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  # Only redirect if file doesn't exist
  conditions = {Status = 404}

# Explicitly serve static files (no redirect needed for these)
# Netlify will serve them directly if they exist

# Add proper headers for static files
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/googlefcce52d0b8aca093.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Force HTTPS
[[redirects]]
  from = "http://victoriousarmyrevivalmovementchurch.netlify.app/*"
  to = "https://victoriousarmyrevivalmovementchurch.netlify.app/:splat"
  status = 301